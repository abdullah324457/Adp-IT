
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADP IT Class</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f3f9;
      color: #202938;
    }

    header {
      background: #183e70;
      color: white;
      text-align: center;
      padding: 55px 15px;
    }

    header h1 {
      font-size: 36px;
      margin: 15px 0 25px;
    }

    header p {
      font-size: 19px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 16px;
    }

    h2 {
      color: #183e70;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin: 25px 0;
    }

    .subject {
      background: white;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 18px;
      text-align: left;
      font-size: 18px;
      font-weight: bold;
      color: #183e70;
      cursor: pointer;
      min-height: 70px;
    }

    .subject.active {
      border-color: #183e70;
      background: #e1ebfa;
    }

    .subject img {
      display: block;
      width: 100%;
      max-height: 150px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    #lectureArea {
      margin-top: 20px;
    }

    .lecture {
      background: white;
      padding: 18px;
      margin: 15px 0;
      border-radius: 12px;
      border-left: 5px solid #183e70;
      overflow-wrap: anywhere;
    }

    .lecture h3 {
      color: #183e70;
      margin-top: 0;
    }

    .lecture p {
      line-height: 1.6;
    }

    .empty {
      background: white;
      padding: 18px;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      color: #69778a;
      padding: 35px 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>ADP IT Class</h1>
    <p>Lectures, Notes and Class Information</p>
  </header>

  <main>
    <h2>Our Subjects</h2>
    <p>Choose a subject to view its lectures.</p>

    <div class="subjects" id="subjects"></div>

    <section id="lectureSection" hidden>
      <h2 id="subjectTitle"></h2>
      <div id="lectureArea"></div>
    </section>
  </main>

  <footer>
    ADP IT Class Website
  </footer>

  <script>
    const subjects = [
      { name: "Mathematics" },
      { name: "ICT", image: "ict.jpg" },
      { name: "English Functional" },
      { name: "English Speaking" },
      { name: "Pakistan Studies" },
      { name: "Applied Physics" }
    ];

    const lectureData = {
      "ICT": [
        {
          title: "IoT",
          lecturer: "RAEES",
          date: "10-10-2026",
          time: "7:00 AM",
          notes: "Internet of Things (IoT)"
        }
      ]
    };

    const subjectsContainer =
      document.getElementById("subjects");

    const lectureSection =
      document.getElementById("lectureSection");

    const subjectTitle =
      document.getElementById("subjectTitle");

    const lectureArea =
      document.getElementById("lectureArea");

    function showSubject(subject, button) {
      document.querySelectorAll(".subject").forEach(item => {
        item.classList.remove("active");
      });

      button.classList.add("active");
      subjectTitle.textContent = subject.name;
      lectureSection.hidden = false;
      lectureArea.replaceChildren();

      const lectures = lectureData[subject.name] || [];

      if (lectures.length === 0) {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "No lectures added yet.";
        lectureArea.appendChild(message);
        return;
      }

      lectures.forEach(lecture => {
        const card = document.createElement("article");
        card.className = "lecture";

        const title = document.createElement("h3");
        title.textContent = lecture.title;
        card.appendChild(title);

        [
          ["Lecturer", lecture.lecturer],
          ["Date", lecture.date],
          ["Time", lecture.time],
          ["Notes", lecture.notes]
        ].forEach(([label, value]) => {
          const p = document.createElement("p");
          p.textContent = label + ": " + value;
          card.appendChild(p);
        });

        lectureArea.appendChild(card);
      });
    }

    subjects.forEach(subject => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "subject";

      if (subject.image) {
        const img = document.createElement("img");
        img.src = subject.image;
        img.alt = subject.name + " picture";

        img.onerror = function() {
          img.remove();
        };

        button.appendChild(img);
      }

      const label = document.createElement("span");
      label.textContent = subject.name;
      button.appendChild(label);

      button.addEventListener("click", () => {
        showSubject(subject, button);
      });

      subjectsContainer.appendChild(button);
    });
  </script>

</body>
</html>
